services:
  bubapp:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Genera valori tuoi: python -c "import secrets; print(secrets.token_hex(32))"
      - SECRET_KEY=${SECRET_KEY:?imposta SECRET_KEY nel file .env}
      - CONTROLLI_PASSWORD=${CONTROLLI_PASSWORD:?imposta CONTROLLI_PASSWORD nel file .env}
    volumes:
      - bubapp_data:/app/data
    restart: unless-stopped

volumes:
  bubapp_data:
